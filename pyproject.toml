[project]
name = "defect-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rutvik Mendpara", email = "rutvikm200@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "gradio>=6.31.0",
    "mlflow>=3.17.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "pillow>=11.0.0",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
defect-detection = "defect_detection:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
]

# CPU-only torch on Linux (CI, servers). The default Linux wheels bundle CUDA, which is
# several GB nobody here needs. macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
